  <text x="178" y="112" fill="#f3f5ef" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="56" letter-spacing="-2">Repo Repro</text>
  <text x="180" y="154" fill="#b6c7cc" font-family="Segoe UI,Arial,sans-serif" font-size="21">Turn GitHub Bugs Into Reproducible, Verifiable Capsules.</text>
